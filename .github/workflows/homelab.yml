name: Homelab build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    if: github.repository == 'iitsGaMa/ccs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run typecheck
      - run: bun test tests/unit/cliproxy/claude-named-limits.test.ts tests/unit/web-server/account-history.test.ts tests/unit/cliproxy/claude-credits.test.ts
      - name: Build image from fork source
        run: docker build -f docker/Dockerfile.homelab -t ccs-homelab:${{ github.sha }} .
      - name: Export image
        run: docker save ccs-homelab:${{ github.sha }} | gzip > ccs-homelab.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ccs-homelab-${{ github.sha }}
          path: ccs-homelab.tar.gz
          retention-days: 14
